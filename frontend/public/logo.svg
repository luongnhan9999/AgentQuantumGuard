<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="qg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="shield_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Quantum Ring Orbit -->
  <circle cx="100" cy="100" r="90" stroke="url(#qg_grad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="100" cy="100" r="76" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />

  <!-- Shield Base -->
  <path d="M100 25 L160 52 C160 115 130 160 100 178 C70 160 40 115 40 52 Z" fill="url(#shield_grad)" stroke="url(#qg_grad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Post-Quantum Cryptography Lattice Matrix Grid -->
  <g stroke="#8B5CF6" stroke-width="1.5" opacity="0.7">
    <line x1="75" y1="65" x2="125" y2="65" />
    <line x1="68" y1="90" x2="132" y2="90" />
    <line x1="75" y1="115" x2="125" y2="115" />
    
    <line x1="85" y1="55" x2="85" y2="125" />
    <line x1="100" y1="50" x2="100" y2="130" />
    <line x1="115" y1="55" x2="115" y2="125" />
  </g>

  <!-- Quantum Lattice Vertices Nodes -->
  <circle cx="85" cy="65" r="4" fill="#06B6D4" />
  <circle cx="100" cy="65" r="4" fill="#8B5CF6" />
  <circle cx="115" cy="65" r="4" fill="#06B6D4" />

  <circle cx="68" cy="90" r="4" fill="#10B981" />
  <circle cx="85" cy="90" r="5" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="100" cy="90" r="7" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="115" cy="90" r="5" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="132" cy="90" r="4" fill="#10B981" />

  <circle cx="85" cy="115" r="4" fill="#06B6D4" />
  <circle cx="100" cy="115" r="4" fill="#8B5CF6" />
  <circle cx="115" cy="115" r="4" fill="#06B6D4" />

  <!-- Central Keyhole / Quantum Core -->
  <circle cx="100" cy="90" r="3" fill="#FFFFFF" />
  <path d="M98 92 L96 102 L104 102 L102 92 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- NIST Standards Certified Seal Checkmark -->
  <path d="M85 142 L95 152 L115 132" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
